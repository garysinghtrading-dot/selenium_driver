name: One-Time File Download

on:
  workflow_dispatch:   # run manually from the Actions tab

permissions:
  contents: write      # allow pushing to the repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download files
        run: |
          wget https://www.accountplusfinance.com/selenium/base_code/anchor_tags.py
          wget https://www.accountplusfinance.com/selenium/base_code/drive_driver.py
          wget https://www.accountplusfinance.com/selenium/base_code/initiate_driver.py
          wget https://www.accountplusfinance.com/selenium/base_code/master.py
          wget https://www.accountplusfinance.com/selenium/base_code/user_agents.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "One-time file download" || echo "No changes to commit"

      - name: Push changes
        run: git push
